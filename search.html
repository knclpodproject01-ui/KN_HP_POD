<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HP POD Search</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <!-- เพิ่ม Library สำหรับช่วยอ่าน Barcode จากกล้อง (Html5-qrcode) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 6px;
            background: #f4f6f8;
            color: #333;
            max-width: 500px;
            margin: 0 auto;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 6px;
            color: #1a1a1a;
        }

        .search-card {
            background: white;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 6px;
            border: 1px solid #e0e0e0;
        }

        .form-label {
            font-size: 12px;
            font-weight: bold;
            color: #444;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label-action {
            font-size: 11px;
            color: #0066cc;
            cursor: pointer;
            font-weight: normal;
        }

        .trip-row {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            width: 100%;
        }

        .trip-row input {
            width: 100%;
            padding: 8px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        .search-btn {
            width: 100%;
            height: 38px;
            border: none;
            border-radius: 4px;
            background: #0066cc;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef2f7;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        /* จัดแถวช่องกรองด่วน + ปุ่มสแกนให้อยู่ด้วยกัน */
        .filter-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .quick-filter-input {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #0066cc;
            border-radius: 6px;
            outline: none;
            background: #fff;
        }

        .scan-barcode-btn {
            padding: 0 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ส่วนแสดงกล้องสแกน */
        #reader {
            width: 100%;
            max-height: 250px;
            background: #000;
            border-radius: 6px;
            margin-bottom: 6px;
            display: none;
        }

        .order-row-compact {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 4px;
        }

        .order-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .trip-number-text {
            font-size: 13px;
            font-weight: bold;
            color: #0066cc;
        }

        .destination-text {
            font-size: 12px;
            color: #333;
            font-weight: 500;
        }

        .remark-text {
            font-size: 11px;
            color: #666;
        }

        .action-btn {
            padding: 6px 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            margin-left: 8px;
        }

        .column-header {
            padding: 6px 8px;
            border-radius: 4px;
            color: white;
            text-align: center;
            font-weight: bold;
            margin-top: 6px;
            font-size: 12px;
            background: #0066cc;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>HP POD Search</h2>

        <div class="search-card">
            <label class="form-label">
                <span>Trip Number</span>
                <span class="label-action" onclick="clearTrip()">ล้างค่า</span>
            </label>
            <div class="trip-row">
                <input id="trip_number" placeholder="กรอก Trip Number...">
            </div>

            <button class="search-btn" onclick="searchOrders()">
                🔍 ค้นหาข้อมูล
            </button>
        </div>

        <div id="result"></div>

    </div>

    <script>

        const client = window.supabase.createClient(
            window.APP_CONFIG.SUPABASE_URL,
            window.APP_CONFIG.SUPABASE_KEY
        );

        let cachedOrders = [];
        let currentTripNumber = "";
        let html5QrCode = null;

        function clearTrip() {
            document.getElementById("trip_number").value = "";
            localStorage.removeItem("hp_trip_number");
        }

        window.onload = function () {
            const params = new URLSearchParams(window.location.search);
            let trip = params.get("trip_number") || localStorage.getItem("hp_trip_number") || "";

            if (trip) {
                document.getElementById("trip_number").value = trip;
                searchOrders();
            }
        };

        function renderOrders(orders) {
            if (orders.length === 0) {
                return `<div style="text-align:center; color:#777; padding: 10px; font-size:12px;">ไม่พบรายการที่ค้นหา</div>`;
            }

            return orders.map(row => {
                return `
        <div class="order-row-compact">
            <div class="order-info">
                <span class="trip-number-text">Trip: ${row.trip_number || '-'}</span>
                <span class="destination-text">ปลายทาง: ${row.destination || '-'}</span>
                <span class="remark-text">หมายเหตุ: ${row.destination_remark || '-'}</span>
            </div>
            <button class="action-btn" onclick="openOrder('${row.trip_number}', '${row.destination}')">
                เปิดข้อมูล
            </button>
        </div>
        `;
            }).join("");
        }

        async function searchOrders() {
            currentTripNumber = document.getElementById("trip_number").value.trim();

            if (!currentTripNumber) {
                alert("กรุณากรอก Trip Number");
                return;
            }

            localStorage.setItem("hp_trip_number", currentTripNumber);

            document.getElementById("result").innerHTML = `<div style="text-align:center; padding:10px; font-size:12px;">กำลังค้นหา...</div>`;

            // Query ตามเงื่อนไข: select distinct trip_number, destination, destination_remark from TBL_KN_HP_POD_SHIPREF where trip_number = ...
            const result = await client
                .from("TBL_KN_HP_POD_SHIPREF")
                .select("trip_number,destination,destination_remark")
                .eq("trip_number", currentTripNumber);

            if (result.error) {
                document.getElementById("result").innerHTML = `<div style="color:red; text-align:center; font-size:12px;">${result.error.message}</div>`;
                return;
            }

            if (!result.data || result.data.length === 0) {
                document.getElementById("result").innerHTML = `<div style="text-align:center; color:#777; padding:10px; font-size:12px;">ไม่พบข้อมูลสำหรับ Trip Number นี้</div>`;
                return;
            }

            // กรองค่าที่ไม่ซ้ำกัน (Distinct) ฝั่ง JavaScript เพื่อความแม่นยำ
            const uniqueMap = new Map();
            result.data.forEach(item => {
                const key = `${item.trip_number}|${item.destination}|${item.destination_remark}`;
                if (!uniqueMap.has(key)) {
                    uniqueMap.set(key, item);
                }
            });

            cachedOrders = Array.from(uniqueMap.values());
            displayResults(cachedOrders);
        }

        function displayResults(data) {
            let html = `
    <div class="summary-bar">
        <span>รายการทั้งหมด: ${cachedOrders.length} ปลายทาง</span>
    </div>

    <!-- พื้นที่แสดงกล้องสแกน (ซ่อนไว้ก่อนจนกว่าจะกดปุ่ม) -->
    <div id="reader"></div>

    <!-- ช่องกรองด่วน (ค้นหาจาก destination) + ปุ่มสแกน Barcode -->
    <div class="filter-row">
        <input type="text" id="quickFilter" class="quick-filter-input" placeholder="🔍 กรองปลายทาง (Destination)..." oninput="filterOrders()">
        <button class="scan-barcode-btn" onclick="startScanner()">📷 สแกน</button>
    </div>

    <div>
        <div class="column-header">
            📌 รายการปลายทาง (<span id="resultCount">${data.length}</span>)
        </div>
        <div id="orderList" style="margin-top: 4px;">
            ${renderOrders(data)}
        </div>
    </div>
    `;

            document.getElementById("result").innerHTML = html;
        }

        // ฟังก์ชันเปิดกล้องสแกน Barcode/QR Code
        function startScanner() {
            const readerDiv = document.getElementById("reader");
            readerDiv.style.display = "block";

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            html5QrCode.start(
                { facingMode: "environment" }, // ใช้กล้องหลัง
                {
                    fps: 10,
                    qrbox: { width: 250, height: 100 }
                },
                (decodedText, decodedResult) => {
                    // เมื่อสแกนสำเร็จ นำไปกรองที่ Quick Filter
                    document.getElementById("quickFilter").value = decodedText;
                    filterOrders();

                    // ปิดกล้องหลังสแกนสำเร็จ
                    html5QrCode.stop().then(() => {
                        readerDiv.style.display = "none";
                    }).catch(err => console.error(err));
                },
                (errorMessage) => {
                    // กำลังสแกนหา...
                }
            ).catch(err => {
                alert("ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบสิทธิ์การใช้งานกล้อง: " + err);
                readerDiv.style.display = "none";
            });
        }

        // แก้ไข QuickFilter ให้ไปค้นหาจาก destination ตามข้อ 5
        function filterOrders() {
            const keyword = document.getElementById("quickFilter").value.toLowerCase().trim();

            const filtered = cachedOrders.filter(row =>
                row.destination && row.destination.toLowerCase().includes(keyword)
            );

            document.getElementById("orderList").innerHTML = renderOrders(filtered);
            document.getElementById("resultCount").innerText = filtered.length;
        }

        // แก้ไขฟังก์ชัน openOrder ใน search.html ให้แนบค่า destination ไปด้วย
        function openOrder(tripNumber, destination) {
            window.location.href = `index.html?trip_number=${encodeURIComponent(tripNumber)}&destination=${encodeURIComponent(destination)}`;
        }

    </script>

</body>

</html>
