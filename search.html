<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HP POD Search</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 8px;
            background: #f4f6f8;
            color: #333;
            max-width: 500px;
            margin: 0 auto;
        }

        .container {
            width: 100%;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .search-card {
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
        }

        .form-label {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 4px;
            display: block;
        }

        /* จัดช่องทะเบียนรถให้อยู่ในบรรทัดเดียวกัน */
        .plate-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .plate-row input {
            padding: 10px 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-align: center;
        }

        #license_plate1 { flex: 2; } /* หมวดอักษร */
        #license_plate2 { flex: 3; } /* เลขทะเบียน */
        #license_plate3 { flex: 3; } /* จังหวัด */

        input[type="date"] {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            margin-bottom: 8px;
        }

        .search-btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 6px;
            background: #0066cc;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-btn:active {
            background: #004999;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
            font-size: 13px;
        }

        .order-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .order-number {
            font-size: 15px;
            font-weight: bold;
            color: #0066cc;
        }

        .status-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-d1 { background: #d4edda; color: #155724; }
        .status-ap { background: #f8d7da; color: #721c24; }
        .status-pending { background: #fff3cd; color: #856404; }

        .order-btn {
            width: 100%;
            height: 38px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
        }

        .order-btn:active {
            background: #1e7e34;
        }

        .summary-card {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            background: #eef2f7;
            padding: 8px;
        }

        .column-header {
            padding: 8px 10px;
            border-radius: 6px;
            color: white;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            font-size: 13px;
        }

        .pending-header { background: #ff9800; }
        .completed-header { background: #28a745; }

        .completed-section {
            margin-top: 10px;
        }

        .collapse-btn {
            background: #6c757d;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .hidden { display: none; }
    </style>
</head>

<body>

<div class="container">

    <h2>HP POD Search</h2>

    <div class="search-card">
        <label class="form-label">ทะเบียนรถ</label>
        <div class="plate-row">
            <input id="license_plate1" placeholder="เช่น กก">
            <input id="license_plate2" placeholder="1234">
            <input id="license_plate3" placeholder="กรุงเทพฯ">
        </div>

        <label class="form-label">วันที่ปฏิบัติงาน (Assignment Date)</label>
        <input id="assignment_date" type="date">

        <button class="search-btn" onclick="searchOrders()">
            🔍 ค้นหางาน
        </button>
    </div>

    <div id="result"></div>

</div>

<script>

const client = window.supabase.createClient(
    window.APP_CONFIG.SUPABASE_URL,
    window.APP_CONFIG.SUPABASE_KEY
);

function formatDateToYYYYMMDD(dateValue) {
    if (!dateValue) return "";
    return dateValue.replaceAll("-", "");
}

// ตั้งค่าวันที่ปัจจุบันเป็นค่าเริ่มต้นหากยังไม่มีค่า
window.onload = function () {
    const today = new Date().toISOString().split('T')[0];
    
    const params = new URLSearchParams(window.location.search);
    let lp1 = params.get("lp1") || localStorage.getItem("hp_lp1") || "";
    let lp2 = params.get("lp2") || localStorage.getItem("hp_lp2") || "";
    let lp3 = params.get("lp3") || localStorage.getItem("hp_lp3") || "";
    let date = params.get("date") || localStorage.getItem("hp_date") || today.replaceAll("-", "");

    if (lp1) document.getElementById("license_plate1").value = lp1;
    if (lp2) document.getElementById("license_plate2").value = lp2;
    if (lp3) document.getElementById("license_plate3").value = lp3;

    if (date) {
        const displayDate = date.substring(0,4) + "-" + date.substring(4,6) + "-" + date.substring(6,8);
        document.getElementById("assignment_date").value = displayDate;
    } else {
        document.getElementById("assignment_date").value = today;
    }

    if (lp1 && lp2 && lp3 && date) {
        searchOrders();
    }
};

function toggleCompleted() {
    const content = document.getElementById("completed-content");
    const btn = document.getElementById("completed-btn");

    if (content.classList.contains("hidden")) {
        content.classList.remove("hidden");
        btn.innerHTML = "▼ ซ่อนรายการส่งสำเร็จแล้ว";
    } else {
        content.classList.add("hidden");
        btn.innerHTML = "▶ แสดงรายการส่งสำเร็จแล้ว";
    }
}

function renderOrders(orders, lp1, lp2, lp3, assignDate) {
    if (orders.length === 0) {
        return `<div class="card" style="text-align:center; color:#777;">ไม่มีรายการ</div>`;
    }

    return orders.map(row => {
        let statusText = row.status_code || "รอดำเนินการ";
        let statusClass = "status-pending";

        if (row.status_code === "D1") {
            statusText = "D1 : สำเร็จ";
            statusClass = "status-d1";
        } else if (row.status_code === "AP") {
            statusText = "AP : ไม่สำเร็จ";
            statusClass = "status-ap";
        }

        return `
        <div class="card">
            <div class="order-item-header">
                <span class="order-number">${row.order_number}</span>
                <span class="status-badge ${statusClass}">${statusText}</span>
            </div>
            <div style="font-size: 12px; color: #666; margin-bottom: 6px;">
                วันที่: ${row.assignment_date}
            </div>
            <button class="order-btn" onclick="openOrder('${row.id}', '${encodeURIComponent(lp1)}', '${encodeURIComponent(lp2)}', '${encodeURIComponent(lp3)}', '${assignDate}')">
                📂 เปิด POD
            </button>
        </div>
        `;
    }).join("");
}

async function searchOrders() {
    const lp1 = document.getElementById("license_plate1").value.trim();
    const lp2 = document.getElementById("license_plate2").value.trim();
    const lp3 = document.getElementById("license_plate3").value.trim();
    const rawDate = document.getElementById("assignment_date").value;
    const assignDate = formatDateToYYYYMMDD(rawDate);

    if (!lp1 || !lp2 || !lp3 || !assignDate) {
        alert("กรุณากรอกข้อมูลทะเบียนรถและวันที่ให้ครบถ้วน");
        return;
    }

    // บันทึกค่าลง LocalStorage เพื่อให้ครั้งหน้าไม่ต้องกรอกใหม่
    localStorage.setItem("hp_lp1", lp1);
    localStorage.setItem("hp_lp2", lp2);
    localStorage.setItem("hp_lp3", lp3);
    localStorage.setItem("hp_date", assignDate);

    document.getElementById("result").innerHTML = `<div class="card" style="text-align:center;">กำลังค้นหา...</div>`;

    const result = await client
        .from("TBL_KN_HP_POD_SHIPREF")
        .select("id,order_number,status_code,assignment_date")
        .eq("license_plate1", lp1)
        .eq("license_plate2", lp2)
        .eq("license_plate3", lp3)
        .eq("assignment_date", assignDate)
        .order("order_number", { ascending: true });

    if (result.error) {
        document.getElementById("result").innerHTML = `<div class="card" style="color:red;">${result.error.message}</div>`;
        return;
    }

    if (!result.data || result.data.length === 0) {
        document.getElementById("result").innerHTML = `<div class="card" style="text-align:center; color:#777;">ไม่พบข้อมูลงานสำหรับทะเบียนนี้ในวันที่เลือก</div>`;
        return;
    }

    const pendingOrders = result.data.filter(row => row.status_code === null || row.status_code === "");
    const completedOrders = result.data.filter(row => row.status_code === "D1" || row.status_code === "AP");

    let html = `
    <div class="card summary-card">
        พบทั้งหมด <b>${result.data.length}</b> งาน | 
        <span style="color:#ff9800;">รอส่ง: ${pendingOrders.length}</span> | 
        <span style="color:#28a745;">เสร็จแล้ว: ${completedOrders.length}</span>
    </div>

    <div>
        <div class="column-header pending-header">
            📌 งานที่ต้องจัดส่ง (${pendingOrders.length})
        </div>
        ${renderOrders(pendingOrders, lp1, lp2, lp3, assignDate)}
    </div>
    `;

    if (completedOrders.length > 0) {
        html += `
        <div class="completed-section">
            <button id="completed-btn" class="collapse-btn" onclick="toggleCompleted()">
                ▶ แสดงรายการส่งสำเร็จแล้ว (${completedOrders.length})
            </button>
            <div id="completed-content" class="hidden">
                <div class="column-header completed-header">
                    ✅ รายการที่ส่งสำเร็จแล้ว (${completedOrders.length})
                </div>
                ${renderOrders(completedOrders, lp1, lp2, lp3, assignDate)}
            </div>
        </div>
        `;
    }

    document.getElementById("result").innerHTML = html;
}

function openOrder(id, lp1, lp2, lp3, assignDate) {
    window.location.href = `index.html?id=${id}&lp1=${lp1}&lp2=${lp2}&lp3=${lp3}&date=${assignDate}`;
}

</script>

</body>
</html>
