<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HP POD Search</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <!-- เพิ่ม Library สำหรับช่วยอ่าน Barcode จากกล้อง (Html5-qrcode) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 6px;
            background: #f4f6f8;
            color: #333;
            max-width: 500px;
            margin: 0 auto;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 6px;
            color: #1a1a1a;
        }

        .search-card {
            background: white;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 6px;
            border: 1px solid #e0e0e0;
        }

        .form-label {
            font-size: 12px;
            font-weight: bold;
            color: #444;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label-action {
            font-size: 11px;
            color: #0066cc;
            cursor: pointer;
            font-weight: normal;
        }

        .plate-row {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
            width: 100%;
        }

        .plate-row input {
            width: 100%;
            min-width: 0; 
            padding: 8px 4px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        #license_plate1 { flex: 2; }
        #license_plate2 { flex: 3.5; }
        #license_plate3 { flex: 4.5; }

        .date-row {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }

        input[type="date"] {
            flex: 1;
            min-width: 0;
            padding: 7px 6px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
        }

        .today-btn {
            padding: 0 8px;
            background: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
        }

        .search-btn {
            width: 100%;
            height: 38px;
            border: none;
            border-radius: 4px;
            background: #0066cc;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .summary-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef2f7;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        /* จัดแถวช่องกรองด่วน + ปุ่มสแกนให้อยู่ด้วยกัน */
        .filter-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .quick-filter-input {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            font-size: 13px;
            border: 1px solid #0066cc;
            border-radius: 6px;
            outline: none;
            background: #fff;
        }

        .scan-barcode-btn {
            padding: 0 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ส่วนแสดงกล้องสแกน */
        #reader {
            width: 100%;
            max-height: 250px;
            background: #000;
            border-radius: 6px;
            margin-bottom: 6px;
            display: none;
        }

        .order-row-compact {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 4px;
        }

        .order-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }

        .order-number {
            font-size: 13px;
            font-weight: bold;
            color: #0066cc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-text {
            font-size: 11px;
            color: #666;
        }

        .status-d1 { color: #155724; font-weight: bold; }
        .status-ap { color: #721c24; font-weight: bold; }
        .status-pending { color: #b78103; font-weight: bold; }

        .action-btn {
            padding: 6px 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            margin-left: 8px;
        }

        .column-header {
            padding: 6px 8px;
            border-radius: 4px;
            color: white;
            text-align: center;
            font-weight: bold;
            margin-top: 6px;
            font-size: 12px;
        }

        .pending-header { background: #ff9800; }
        .completed-header { background: #28a745; }

        .collapse-btn {
            background: #6c757d;
            color: white;
            width: 100%;
            padding: 6px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }

        .hidden { display: none; }
    </style>
</head>

<body>

<div class="container">

    <h2>HP POD Search</h2>

    <div class="search-card">
        <label class="form-label">
            <span>ทะเบียนรถ</span>
            <span class="label-action" onclick="clearPlate()">ล้างค่า</span>
        </label>
        <div class="plate-row">
            <input id="license_plate1" placeholder="หมวด">
            <input id="license_plate2" placeholder="เลขทะเบียน">
            <input id="license_plate3" placeholder="จังหวัด">
        </div>

        <label class="form-label">วันที่ปฏิบัติงาน</label>
        <div class="date-row">
            <input id="assignment_date" type="date">
            <button class="today-btn" onclick="setTodayDate()">วันนี้</button>
        </div>

        <button class="search-btn" onclick="searchOrders()">
            🔍 ค้นหางาน
        </button>
    </div>

    <div id="result"></div>

</div>

<script>

const client = window.supabase.createClient(
    window.APP_CONFIG.SUPABASE_URL,
    window.APP_CONFIG.SUPABASE_KEY
);

let cachedOrders = [];
let currentLp1 = "", currentLp2 = "", currentLp3 = "", currentAssignDate = "";
let html5QrCode = null;

function formatDateToYYYYMMDD(dateValue) {
    if (!dateValue) return "";
    return dateValue.replaceAll("-", "");
}

function setTodayDate() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("assignment_date").value = today;
}

function clearPlate() {
    document.getElementById("license_plate1").value = "";
    document.getElementById("license_plate2").value = "";
    document.getElementById("license_plate3").value = "";
    localStorage.removeItem("hp_lp1");
    localStorage.removeItem("hp_lp2");
    localStorage.removeItem("hp_lp3");
}

window.onload = function () {
    const today = new Date().toISOString().split('T')[0];
    
    const params = new URLSearchParams(window.location.search);
    let lp1 = params.get("lp1") || localStorage.getItem("hp_lp1") || "";
    let lp2 = params.get("lp2") || localStorage.getItem("hp_lp2") || "";
    let lp3 = params.get("lp3") || localStorage.getItem("hp_lp3") || "";
    let date = params.get("date") || localStorage.getItem("hp_date") || today.replaceAll("-", "");

    if (lp1) document.getElementById("license_plate1").value = lp1;
    if (lp2) document.getElementById("license_plate2").value = lp2;
    if (lp3) document.getElementById("license_plate3").value = lp3;

    if (date && date.length === 8) {
        const displayDate = date.substring(0,4) + "-" + date.substring(4,6) + "-" + date.substring(6,8);
        document.getElementById("assignment_date").value = displayDate;
    } else {
        document.getElementById("assignment_date").value = today;
    }

    if (lp1 && lp2 && lp3 && date) {
        searchOrders();
    }
};

function toggleCompleted() {
    const content = document.getElementById("completed-content");
    const btn = document.getElementById("completed-btn");

    if (content.classList.contains("hidden")) {
        content.classList.remove("hidden");
        btn.innerHTML = "▼ ซ่อนรายการส่งสำเร็จแล้ว";
    } else {
        content.classList.add("hidden");
        btn.innerHTML = "▶ แสดงรายการส่งสำเร็จแล้ว";
    }
}

function renderOrders(orders) {
    if (orders.length === 0) {
        return `<div style="text-align:center; color:#777; padding: 10px; font-size:12px;">ไม่พบรายการที่ค้นหา</div>`;
    }

    return orders.map(row => {
        let statusText = "รอดำเนินการ";
        let statusClass = "status-pending";

        if (row.status_code === "D1") {
            statusText = "D1 : สำเร็จ";
            statusClass = "status-d1";
        } else if (row.status_code === "AP") {
            statusText = "AP : ไม่สำเร็จ";
            statusClass = "status-ap";
        }

        return `
        <div class="order-row-compact">
            <div class="order-info">
                <span class="order-number">${row.order_number}</span>
                <span class="status-text ${statusClass}">${statusText}</span>
            </div>
            <button class="action-btn" onclick="openOrder('${row.id}')">
                เปิด POD
            </button>
        </div>
        `;
    }).join("");
}

async function searchOrders() {
    currentLp1 = document.getElementById("license_plate1").value.trim();
    currentLp2 = document.getElementById("license_plate2").value.trim();
    currentLp3 = document.getElementById("license_plate3").value.trim();
    const rawDate = document.getElementById("assignment_date").value;
    currentAssignDate = formatDateToYYYYMMDD(rawDate);

    if (!currentLp1 || !currentLp2 || !currentLp3 || !currentAssignDate) {
        alert("กรุณากรอกข้อมูลทะเบียนรถและวันที่ให้ครบถ้วน");
        return;
    }

    localStorage.setItem("hp_lp1", currentLp1);
    localStorage.setItem("hp_lp2", currentLp2);
    localStorage.setItem("hp_lp3", currentLp3);
    localStorage.setItem("hp_date", currentAssignDate);

    document.getElementById("result").innerHTML = `<div style="text-align:center; padding:10px; font-size:12px;">กำลังค้นหา...</div>`;

    const result = await client
        .from("TBL_KN_HP_POD_SHIPREF")
        .select("id,order_number,status_code,assignment_date")
        .eq("license_plate1", currentLp1)
        .eq("license_plate2", currentLp2)
        .eq("license_plate3", currentLp3)
        .eq("assignment_date", currentAssignDate)
        .order("order_number", { ascending: true });

    if (result.error) {
        document.getElementById("result").innerHTML = `<div style="color:red; text-align:center; font-size:12px;">${result.error.message}</div>`;
        return;
    }

    if (!result.data || result.data.length === 0) {
        document.getElementById("result").innerHTML = `<div style="text-align:center; color:#777; padding:10px; font-size:12px;">ไม่พบข้อมูลงานสำหรับทะเบียนนี้ในวันที่เลือก</div>`;
        return;
    }

    cachedOrders = result.data;
    displayResults(cachedOrders);
}

function displayResults(data) {
    const pendingOrders = data.filter(row => row.status_code === null || row.status_code === "");
    const completedOrders = data.filter(row => row.status_code === "D1" || row.status_code === "AP");

    let html = `
    <div class="summary-bar">
        <span>ทั้งหมด: ${cachedOrders.length} งาน</span>
        <span style="color:#ff9800;">รอส่ง: ${cachedOrders.filter(r => !r.status_code).length}</span>
        <span style="color:#28a745;">เสร็จ: ${cachedOrders.filter(r => r.status_code).length}</span>
    </div>

    <!-- พื้นที่แสดงกล้องสแกน (ซ่อนไว้ก่อนจนกว่าจะกดปุ่ม) -->
    <div id="reader"></div>

    <!-- ช่องกรองด่วน + ปุ่มสแกน Barcode -->
    <div class="filter-row">
        <input type="text" id="quickFilter" class="quick-filter-input" placeholder="🔍 พิมพ์หรือสแกน Barcode..." oninput="filterOrders()">
        <button class="scan-barcode-btn" onclick="startScanner()">📷 สแกน</button>
    </div>

    <div>
        <div class="column-header pending-header">
            📌 งานที่ต้องจัดส่ง (<span id="pendingCount">${pendingOrders.length}</span>)
        </div>
        <div id="pendingList" style="margin-top: 4px;">
            ${renderOrders(pendingOrders)}
        </div>
    </div>
    `;

    if (completedOrders.length > 0) {
        html += `
        <div style="margin-top: 6px;">
            <button id="completed-btn" class="collapse-btn" onclick="toggleCompleted()">
                ▶ แสดงรายการส่งสำเร็จแล้ว (<span id="completedCount">${completedOrders.length}</span>)
            </button>
            <div id="completed-content" class="hidden" style="margin-top: 4px;">
                <div class="column-header completed-header">
                    ✅ รายการที่ส่งสำเร็จแล้ว
                </div>
                <div id="completedList" style="margin-top: 4px;">
                    ${renderOrders(completedOrders)}
                </div>
            </div>
        </div>
        `;
    }

    document.getElementById("result").innerHTML = html;
}

// ฟังก์ชันเปิดกล้องสแกน Barcode/QR Code
function startScanner() {
    const readerDiv = document.getElementById("reader");
    readerDiv.style.display = "block";

    if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
    }

    html5QrCode.start(
        { facingMode: "environment" }, // ใช้กล้องหลัง
        {
            fps: 10,
            qrbox: { width: 250, height: 100 }
        },
        (decodedText, decodedResult) => {
            // เมื่อสแกนสำเร็จ
            document.getElementById("quickFilter").value = decodedText;
            filterOrders();
            
            // ปิดกล้องหลังสแกนสำเร็จ
            html5QrCode.stop().then(() => {
                readerDiv.style.display = "none";
            }).catch(err => console.error(err));
        },
        (errorMessage) => {
            // กำลังสแกนหา... (ปล่อยว่างไว้เพื่อไม่ให้ขึ้น Error log รบกวน)
        }
    ).catch(err => {
        alert("ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบสิทธิ์การใช้งานกล้อง: " + err);
        readerDiv.style.display = "none";
    });
}

function filterOrders() {
    const keyword = document.getElementById("quickFilter").value.toLowerCase().trim();
    
    const filtered = cachedOrders.filter(row => 
        row.order_number.toLowerCase().includes(keyword)
    );

    const pendingOrders = filtered.filter(row => row.status_code === null || row.status_code === "");
    const completedOrders = filtered.filter(row => row.status_code === "D1" || row.status_code === "AP");

    document.getElementById("pendingList").innerHTML = renderOrders(pendingOrders);
    document.getElementById("pendingCount").innerText = pendingOrders.length;
    
    const compList = document.getElementById("completedList");
    if (compList) {
        compList.innerHTML = renderOrders(completedOrders);
        document.getElementById("completedCount").innerText = completedOrders.length;
    }
}

function openOrder(id) {
    window.location.href = `index.html?id=${id}&lp1=${encodeURIComponent(currentLp1)}&lp2=${encodeURIComponent(currentLp2)}&lp3=${encodeURIComponent(currentLp3)}&date=${currentAssignDate}`;
}

</script>

</body>
</html>
