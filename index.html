<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HP POD Upload</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 8px;
            background: #f4f6f8;
            color: #333;
            max-width: 500px;
            margin: 0 auto;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 6px;
            color: #1a1a1a;
        }

        h3 {
            font-size: 14px;
            margin: 8px 0 4px 0;
            color: #444;
        }

        .card {
            border: 1px solid #e0e0e0;
            padding: 10px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.4;
        }

        /* รวมการ์ดถ่ายรูปทั้งหมดไว้ในการ์ดเดียว เพื่อประหยัดพื้นที่แนวตั้ง */
        .photo-section-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
        }

        /* จัดเรียงรายการถ่ายรูปให้เป็นแถวแนวนอนที่กะทัดรัด */
        .photo-row-compact {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid #f0f0f0;
        }

        .photo-row-compact:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .photo-label {
            font-size: 13px;
            font-weight: 600;
            width: 100px;
            color: #444;
        }

        .preview-box {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 6px;
            overflow: hidden;
            background: #f0f0f0;
            border: 1px dashed #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 6px;
        }

        .placeholder {
            color: #888;
            font-size: 10px;
            text-align: center;
            padding: 2px;
        }

        .file-input {
            display: none;
        }

        .camera-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            background: #0066cc;
            color: white;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }

        .camera-btn:active {
            background: #004999;
        }

        /* Status & Reason Group */
        .status-group, .reason-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .status-btn, .reason-btn {
            width: 100%;
            min-height: 40px;
            padding: 8px 10px;
            background: white;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            word-break: break-word;
        }

        .status-btn.active {
            background: #28a745;
            color: white;
            border-color: #28a745;
            font-weight: bold;
        }

        .reason-btn.reason-active {
            background: #ff9800;
            color: white;
            border-color: #ff9800;
            font-weight: bold;
        }

        .badge-code {
            display: inline-block;
            padding: 2px 5px;
            background: rgba(0,0,0,0.08);
            border-radius: 4px;
            font-weight: bold;
            margin-right: 6px;
            font-size: 12px;
        }

        .status-btn.active .badge-code,
        .reason-btn.reason-active .badge-code {
            background: rgba(255,255,255,0.25);
            color: white;
        }

        .submit-btn {
            width: 100%;
            height: 46px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(40, 167, 69, 0.2);
        }

        .submit-btn:active {
            background: #1e7e34;
        }

        #reasonSelected {
            margin-top: 4px;
            font-size: 13px;
            color: #d97706;
            font-weight: bold;
        }

        #msg {
            margin-top: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #0066cc;
        }
    </style>
</head>

<body>

    <h2>HP POD Upload</h2>

    <div class="card">
        <div id="orderInfo">Loading...</div>
    </div>

    <!-- Section: Photos (รวมไว้ในการ์ดเดียวกันแบบ Compact) -->
    <div class="photo-section-card">
        <div class="section-title">📷 บันทึกภาพถ่าย (3 รูป)</div>

        <!-- รูปที่ 1 -->
        <div class="photo-row-compact">
            <span class="photo-label">1. สถานที่จัดส่ง</span>
            <div class="preview-box">
                <div id="holder1" class="placeholder">รอรูป</div>
                <img id="preview1" class="preview">
            </div>
            <label for="img1" class="camera-btn">ถ่ายรูปที่ 1</label>
        </div>
        <input type="file" id="img1" class="file-input" accept="image/*" capture="environment">

        <!-- รูปที่ 2 -->
        <div class="photo-row-compact">
            <span class="photo-label">2. ภาพสินค้า</span>
            <div class="preview-box">
                <div id="holder2" class="placeholder">รอรูป</div>
                <img id="preview2" class="preview">
            </div>
            <label for="img2" class="camera-btn">ถ่ายรูปที่ 2</label>
        </div>
        <input type="file" id="img2" class="file-input" accept="image/*" capture="environment">

        <!-- รูปที่ 3 -->
        <div class="photo-row-compact">
            <span class="photo-label">3. ภาพเอกสาร</span>
            <div class="preview-box">
                <div id="holder3" class="placeholder">รอรูป</div>
                <img id="preview3" class="preview">
            </div>
            <label for="img3" class="camera-btn">ถ่ายรูปที่ 3</label>
        </div>
        <input type="file" id="img3" class="file-input" accept="image/*" capture="environment">
    </div>

    <!-- Section: Status Code -->
    <h3>เลือกสถานะ (Status Code)</h3>
    <div class="status-group">
        <button class="status-btn" id="btnD1" onclick="setStatus('D1')">
            <span class="badge-code">D1</span> ขนถ่ายสินค้า ณ จุดส่งมอบเสร็จสิ้น
        </button>
        <button class="status-btn" id="btnAP" onclick="setStatus('AP')">
            <span class="badge-code">AP</span> การจัดส่งไม่สำเร็จ
        </button>
    </div>

    <!-- Section: Reason Code -->
    <div id="reasonArea" style="display:none">
        <h3>ระบุเหตุผล (Reason Code)</h3>
        <div class="reason-group">
            <button class="reason-btn" id="btnAK" onclick="setReason('AK')">
                <span class="badge-code">AK</span> สินค้าชำรุด
            </button>
            <button class="reason-btn" id="btnBS" onclick="setReason('BS')">
                <span class="badge-code">BS</span> ลูกค้าปฏิเสธรับสินค้า
            </button>
            <button class="reason-btn" id="btnA1" onclick="setReason('A1')">
                <span class="badge-code">A1</span> พ้นช่วงเวลาที่กำหนด
            </button>
        </div>
        <div id="reasonSelected"></div>
    </div>

    <button class="submit-btn" onclick="savePOD()">UPLOAD POD</button>
    <div id="msg"></div>

    <script>
        const client = window.supabase.createClient(
            window.APP_CONFIG.SUPABASE_URL,
            window.APP_CONFIG.SUPABASE_KEY
        );

        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get("id");
        const licensePlate1 = urlParams.get("lp1");
        const licensePlate2 = urlParams.get("lp2");
        const licensePlate3 = urlParams.get("lp3");
        const assignmentDate = urlParams.get("date");

        if (!orderId) {
            alert("Missing Order ID");
            window.location.href = "search.html";
        }

        let orderData = null;
        let statusCode = null;
        let reasonCode = null;
        let latitude = 0;
        let longitude = 0;
        let image1Blob = null;
        let image2Blob = null;
        let image3Blob = null;

        navigator.geolocation.getCurrentPosition(
            function (position) {
                latitude = position.coords.latitude;
                longitude = position.coords.longitude;
            },
            function (error) {
                console.log(error.message);
                latitude = 0;
                longitude = 0;
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );

        async function loadOrder() {
            const result = await client
                .from("TBL_KN_HP_POD_SHIPREF")
                .select("*")
                .eq("id", orderId)
                .single();

            if (result.error) {
                alert("Order Not Found");
                return;
            }

            orderData = result.data;
            document.getElementById("orderInfo").innerHTML = `
                <div style="font-size: 15px; font-weight: bold; margin-bottom: 2px;">Order: ${orderData.order_number}</div>
                <div><b>Assignment Date:</b> ${orderData.assignment_date || '-'} | <b>Status:</b> ${orderData.status_code || "-"}</div>
            `;
        }

        loadOrder();

        function setStatus(value) {
            statusCode = value;
            document.getElementById("btnD1").classList.remove("active");
            document.getElementById("btnAP").classList.remove("active");

            if (value === "D1") {
                document.getElementById("btnD1").classList.add("active");
                reasonCode = "NS";
                document.getElementById("reasonArea").style.display = "none";
            }

            if (value === "AP") {
                document.getElementById("btnAP").classList.add("active");
                reasonCode = null;
                document.getElementById("reasonArea").style.display = "block";
                
                document.querySelectorAll('.reason-btn').forEach(btn => btn.classList.remove('reason-active'));
                document.getElementById("reasonSelected").innerHTML = "";
            }
        }

        function setReason(value) {
            reasonCode = value;
            document.querySelectorAll('.reason-btn').forEach(btn => btn.classList.remove('reason-active'));
            
            const selectedBtn = document.getElementById("btn" + value);
            if (selectedBtn) {
                selectedBtn.classList.add("reason-active");
            }

            document.getElementById("reasonSelected").innerHTML = "<b>เลือกเหตุผล:</b> " + value;
        }

        function resizeImage(file, callback) {
            const img = new Image();
            img.onload = function () {
                let width = img.width;
                let height = img.height;
                const MAX = 1280;

                if (width > height) {
                    if (width > MAX) {
                        height = Math.round((height * MAX) / width);
                        width = MAX;
                    }
                } else {
                    if (height > MAX) {
                        width = Math.round((width * MAX) / height);
                        height = MAX;
                    }
                }

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                canvas.toBlob(
                    function (blob) {
                        callback(blob);
                    },
                    "image/jpeg",
                    0.8
                );
            };

            img.src = URL.createObjectURL(file);
        }

        function setupImageHandler(inputId, holderId, previewId, setBlobCallback) {
            document.getElementById(inputId).addEventListener("change", function (e) {
                const file = e.target.files[0];
                if (!file) return;

                resizeImage(file, function (blob) {
                    setBlobCallback(blob);
                    document.getElementById(holderId).style.display = "none";
                    const imgPreview = document.getElementById(previewId);
                    imgPreview.src = URL.createObjectURL(blob);
                    imgPreview.style.display = "block";
                });
            });
        }

        setupImageHandler("img1", "holder1", "preview1", blob => image1Blob = blob);
        setupImageHandler("img2", "holder2", "preview2", blob => image2Blob = blob);
        setupImageHandler("img3", "holder3", "preview3", blob => image3Blob = blob);

        async function uploadFile(blob, fileName) {
            const result = await client.storage
                .from("BUCKET_HP_POD_IMAGES")
                .upload(fileName, blob, {
                    contentType: "image/jpeg",
                    upsert: false
                });

            if (result.error) {
                throw new Error(result.error.message);
            }

            return client.storage
                .from("BUCKET_HP_POD_IMAGES")
                .getPublicUrl(fileName).data.publicUrl;
        }

        async function savePOD() {
            try {
                if (!statusCode) {
                    alert("กรุณาเลือก Status");
                    return;
                }

                if (statusCode === "AP" && !reasonCode) {
                    alert("กรุณาเลือก Reason");
                    return;
                }

                if (!image1Blob || !image2Blob || !image3Blob) {
                    alert("กรุณาถ่ายรูปให้ครบ 3 รูป");
                    return;
                }

                if (latitude === 0 || longitude === 0) {
                    alert("ไม่สามารถอ่าน GPS ได้");
                    return;
                }

                document.getElementById("msg").innerHTML = "Uploading Images and Saving POD...";

                const orderNo = orderData.order_number;
                const timestamp = new Date().toISOString().replace(/[-:TZ.]/g, "").substring(0, 14);

                const [image1Url, image2Url, image3Url] = await Promise.all([
                    uploadFile(image1Blob, `${orderNo}_img1_${timestamp}.jpg`),
                    uploadFile(image2Blob, `${orderNo}_img2_${timestamp}.jpg`),
                    uploadFile(image3Blob, `${orderNo}_img3_${timestamp}.jpg`)
                ]);

                const updateResult = await client
                    .from("TBL_KN_HP_POD_SHIPREF")
                    .update({
                        image1_url: image1Url,
                        image2_url: image2Url,
                        image3_url: image3Url,
                        status_code: statusCode,
                        reason_code: reasonCode,
                        latitude: String(latitude),
                        longitude: String(longitude),
                        upload_timestamp: new Date().toISOString()
                    })
                    .eq("id", orderId);

                if (updateResult.error) {
                    alert(updateResult.error.message);
                    return;
                }

                document.getElementById("msg").innerHTML = "Upload Success";
                alert("Upload Success");

                window.location.href = `search.html?lp1=${encodeURIComponent(licensePlate1)}&lp2=${encodeURIComponent(licensePlate2)}&lp3=${encodeURIComponent(licensePlate3)}&date=${encodeURIComponent(assignmentDate)}`;

            } catch (err) {
                console.error(err);
                    alert(err.message);
                document.getElementById("msg").innerHTML = "Upload Failed";
            }
        }
    </script>
</body>

</html>
