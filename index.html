<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>HP POD Upload</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            background: #f5f5f5;
        }

        .card {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 8px;
            background: white;
        }

        .photo-card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
            background: white;
        }

        .photo-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .preview,
        .placeholder {
            width: 90px;
            height: 60px;
            min-width: 90px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .preview {
            display: none;

            width: 90px;
            height: 60px;

            min-width: 90px;
            max-width: 90px;

            min-height: 60px;
            max-height: 60px;

            object-fit: contain;

            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }

        .preview {
            object-fit: cover;
            display: none;
        }

        .placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #efefef;
            color: #888;
            font-size: 16px;
        }

        .file-input {
            display: none;
        }

        .camera-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #0066cc;
            color: white;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
        }

        .status-btn {
            margin-top: 10px;
        }

        .active {
            background: #28a745;
            color: white;
        }

        .reason-active {
            background: #ff9800;
            color: white;
        }

        .photo-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .photo-row .camera-btn {
            flex: 1;
            margin-top: 0;
        }
    </style>

</head>

<body>

    <h2>HP POD Upload</h2>

    <div class="card">

        <div id="orderInfo">

            Loading...

        </div>

    </div>

    <br>

    <div class="photo-card">

        <div class="photo-title">
            ภาพสถานที่จัดส่ง
        </div>

        <div class="photo-row">

            <div id="holder1" class="placeholder">
                รอถ่ายภาพ
            </div>

            <img id="preview1" class="preview">

            <label for="img1" class="camera-btn">
                📷 ถ่ายรูป 1
            </label>

        </div>

        <input type="file" id="img1" class="file-input" accept="image/*" capture="environment">

    </div>

    <div class="photo-card">

        <div class="photo-title">
            ภาพสินค้า
        </div>

        <div class="photo-row">

            <div id="holder2" class="placeholder">
                รอถ่ายภาพ
            </div>

            <img id="preview2" class="preview">

            <label for="img2" class="camera-btn">
                📷 ถ่ายรูป 2
            </label>

        </div>

        <input type="file" id="img2" class="file-input" accept="image/*" capture="environment">

    </div>

    <div class="photo-card">

        <div class="photo-title">
            ภาพเอกสาร
        </div>

        <div class="photo-row">

            <div id="holder3" class="placeholder">
                รอถ่ายภาพ
            </div>

            <img id="preview3" class="preview">

            <label for="img3" class="camera-btn">
                📷 ถ่ายรูป 3
            </label>

        </div>

        <input type="file" id="img3" class="file-input" accept="image/*" capture="environment">

    </div>

    <h3>Status</h3>

    <button class="status-btn" id="btnD1" onclick="setStatus('D1')">

        D1 : ดำเนินการขนถ่ายสินค้า ณ จุดส่งมอบเสร็จสิ้นแล้ว

    </button>

    <button class="status-btn" id="btnAP" onclick="setStatus('AP')">

        AP : การจัดส่งไม่สำเร็จ

    </button>

    <div id="reasonArea" style="display:none">

        <h3>Reason</h3>

        <button id="btnAK" onclick="setReason('AK')">

            AK : สินค้าชำรุด

        </button>

        <button id="btnBS" onclick="setReason('BS')">

            BS : ลูกค้าปฏิเสธการรับสินค้า

        </button>

        <button id="btnA1" onclick="setReason('A1')">

            A1 : การจัดส่งไม่สำเร็จ / ช่วงเวลาที่กำหนดไว้

        </button>

        <div id="reasonSelected">

        </div>

    </div>

    <br>

    <button onclick="savePOD()">

        UPLOAD POD

    </button>

    <div id="msg"></div>

    <script>

        const client =
            window.supabase.createClient(
                window.APP_CONFIG.SUPABASE_URL,
                window.APP_CONFIG.SUPABASE_KEY
            );

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const orderId =
            urlParams.get("id");

        const licensePlate1 =
            urlParams.get("lp1");

        const licensePlate2 =
            urlParams.get("lp2");

        const licensePlate3 =
            urlParams.get("lp3");

        const assignmentDate =
            urlParams.get("date");

        if (!orderId) {

            alert(
                "Missing Order ID"
            );

            window.location.href =
                "search.html";

        }

        let orderData = null;

        let statusCode = null;

        let reasonCode = null;

        let latitude = 0;

        let longitude = 0;

        let image1Blob = null;

        let image2Blob = null;

        let image3Blob = null;

        navigator.geolocation.getCurrentPosition(

            function (position) {

                latitude =
                    position.coords.latitude;

                longitude =
                    position.coords.longitude;

            },

            function (error) {

                console.log(
                    error.message
                );

                latitude = 0;

                longitude = 0;

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }

        );

        async function loadOrder() {

            const result =

                await client
                    .from(
                        "TBL_KN_HP_POD_SHIPREF"
                    )
                    .select("*")
                    .eq(
                        "id",
                        orderId
                    )
                    .single();

            if (result.error) {

                alert(
                    "Order Not Found"
                );

                return;

            }

            orderData =
                result.data;

            document
                .getElementById(
                    "orderInfo"
                )
                .innerHTML =

                `
<h2>
${orderData.order_number}
</h2>

<b>
Assignment Date :
</b>

${orderData.assignment_date}

<br><br>

<b>
Current Status :
</b>

${orderData.status_code || "-"}
`;

        }

        loadOrder();

        function setStatus(value) {

            statusCode =
                value;

            document
                .getElementById(
                    "btnD1"
                )
                .classList
                .remove(
                    "active"
                );

            document
                .getElementById(
                    "btnAP"
                )
                .classList
                .remove(
                    "active"
                );

            if (value === "D1") {

                document
                    .getElementById(
                        "btnD1"
                    )
                    .classList
                    .add(
                        "active"
                    );

                reasonCode =
                    "NS";

                document
                    .getElementById(
                        "reasonArea"
                    )
                    .style.display =
                    "none";

            }

            if (value === "AP") {

                document
                    .getElementById(
                        "btnAP"
                    )
                    .classList
                    .add(
                        "active"
                    );

                reasonCode =
                    null;

                document
                    .getElementById(
                        "reasonArea"
                    )
                    .style.display =
                    "block";

            }

        }

        function setReason(value) {

            reasonCode =
                value;

            document
                .getElementById(
                    "reasonSelected"
                )
                .innerHTML =

                "<b>Reason :</b> "
                + value;

        }

        function resizeImage(
            file,
            callback
        ) {

            const img =
                new Image();

            img.onload =
                function () {

                    let width =
                        img.width;

                    let height =
                        img.height;

                    const MAX =
                        1280;

                    if (width > height) {

                        if (width > MAX) {

                            height =
                                Math.round(
                                    height *
                                    MAX /
                                    width
                                );

                            width =
                                MAX;

                        }

                    } else {

                        if (height > MAX) {

                            width =
                                Math.round(
                                    width *
                                    MAX /
                                    height
                                );

                            height =
                                MAX;

                        }

                    }

                    const canvas =
                        document.createElement(
                            "canvas"
                        );

                    canvas.width =
                        width;

                    canvas.height =
                        height;

                    const ctx =
                        canvas.getContext(
                            "2d"
                        );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );

                    canvas.toBlob(

                        function (blob) {

                            callback(
                                blob
                            );

                        },

                        "image/jpeg",
                        0.8

                    );

                };

            img.src =
                URL.createObjectURL(
                    file
                );

        }

        document
            .getElementById(
                "img1"
            )
            .addEventListener(
                "change",
                function (e) {

                    const file =
                        e.target.files[0];

                    if (!file) {
                        return;
                    }

                    resizeImage(

                        file,

                        function (blob) {

                            image1Blob =
                                blob;

                            document.getElementById(
                                "holder1"
                            ).style.display = "none";

                            const img1Preview =
                                document.getElementById(
                                    "preview1"
                                );

                            img1Preview.src =
                                URL.createObjectURL(
                                    blob
                                );

                            img1Preview.style.display =
                                "block";

                        }

                    );

                }

            );

        document
            .getElementById(
                "img2"
            )
            .addEventListener(
                "change",
                function (e) {

                    const file =
                        e.target.files[0];

                    if (!file) {
                        return;
                    }

                    resizeImage(

                        file,

                        function (blob) {

                            image2Blob =
                                blob;

                            document.getElementById(
                                "holder2"
                            ).style.display = "none";

                            const img2Preview =
                                document.getElementById(
                                    "preview2"
                                );

                            img2Preview.src =
                                URL.createObjectURL(
                                    blob
                                );

                            img2Preview.style.display =
                                "block";

                        }

                    );

                }

            );

        document
            .getElementById(
                "img3"
            )
            .addEventListener(
                "change",
                function (e) {

                    const file =
                        e.target.files[0];

                    if (!file) {
                        return;
                    }

                    resizeImage(

                        file,

                        function (blob) {

                            image3Blob =
                                blob;

                            document.getElementById(
                                "holder3"
                            ).style.display = "none";

                            const img3Preview =
                                document.getElementById(
                                    "preview3"
                                );

                            img3Preview.src =
                                URL.createObjectURL(
                                    blob
                                );

                            img3Preview.style.display =
                                "block";

                        }

                    );

                }

            );

        async function uploadFile(
            blob,
            fileName
        ) {

            const result =

                await client
                    .storage
                    .from(
                        "BUCKET_HP_POD_IMAGES"
                    )
                    .upload(
                        fileName,
                        blob,
                        {
                            contentType:
                                "image/jpeg",

                            upsert: false
                        }
                    );

            if (
                result.error
            ) {

                throw new Error(
                    result.error.message
                );

            }

            return client
                .storage
                .from(
                    "BUCKET_HP_POD_IMAGES"
                )
                .getPublicUrl(
                    fileName
                )
                .data
                .publicUrl;

        }

        async function savePOD() {

            try {

                if (
                    !statusCode
                ) {

                    alert(
                        "กรุณาเลือก Status"
                    );

                    return;

                }

                if (
                    statusCode === "AP"
                    &&
                    !reasonCode
                ) {

                    alert(
                        "กรุณาเลือก Reason"
                    );

                    return;

                }

                if (
                    !image1Blob ||
                    !image2Blob ||
                    !image3Blob
                ) {

                    alert(
                        "กรุณาถ่ายรูปให้ครบ 3 รูป"
                    );

                    return;

                }

                if (
                    latitude === 0 ||
                    longitude === 0
                ) {

                    alert(
                        "ไม่สามารถอ่าน GPS ได้"
                    );

                    return;

                }

                document
                    .getElementById(
                        "msg"
                    )
                    .innerHTML =

                    "Uploading Images and Saving POD...";

                const orderNo =
                    orderData.order_number;

                const timestamp =
                    new Date()
                        .toISOString()
                        .replace(
                            /[-:TZ.]/g,
                            ""
                        )
                        .substring(
                            0,
                            14
                        );

                const [

                    image1Url,
                    image2Url,
                    image3Url

                ] = await Promise.all([

                    uploadFile(

                        image1Blob,

                        `${orderNo}_img1_${timestamp}.jpg`

                    ),

                    uploadFile(

                        image2Blob,

                        `${orderNo}_img2_${timestamp}.jpg`

                    ),

                    uploadFile(

                        image3Blob,

                        `${orderNo}_img3_${timestamp}.jpg`

                    )

                ]);

                const updateResult =

                    await client

                        .from(
                            "TBL_KN_HP_POD_SHIPREF"
                        )

                        .update({

                            image1_url:
                                image1Url,

                            image2_url:
                                image2Url,

                            image3_url:
                                image3Url,

                            status_code:
                                statusCode,

                            reason_code:
                                reasonCode,

                            latitude:
                                String(
                                    latitude
                                ),

                            longitude:
                                String(
                                    longitude
                                ),

                            upload_timestamp:
                                new Date()
                                    .toISOString()

                        })

                        .eq(
                            "id",
                            orderId
                        );

                if (
                    updateResult.error
                ) {

                    alert(
                        updateResult.error.message
                    );

                    return;

                }

                document
                    .getElementById(
                        "msg"
                    )
                    .innerHTML =

                    "Upload Success";

                alert(
                    "Upload Success"
                );

                window.location.href =

                    `search.html
?lp1=${encodeURIComponent(licensePlate1)}
&lp2=${encodeURIComponent(licensePlate2)}
&lp3=${encodeURIComponent(licensePlate3)}
&date=${encodeURIComponent(assignmentDate)}`;

            }
            catch (err) {

                console.error(
                    err
                );

                alert(
                    err.message
                );

                document
                    .getElementById(
                        "msg"
                    )
                    .innerHTML =

                    "Upload Failed";

            }

        }

    </script>

</body>

</html>
